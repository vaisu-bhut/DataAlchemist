services:
  pubsub:
    build:
      context: .
      dockerfile: pubsub/Dockerfile
    container_name: pubsub
    ports:
      - "8001:8001"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  master-agent:
    build:
      context: .
      dockerfile: agents/master/Dockerfile
    container_name: master-agent
    ports:
      - "8000:8000"
    environment:
      - PUBSUB_URL=http://pubsub:8001
    env_file:
      - .env
    depends_on:
      pubsub:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ingest-agent:
    build:
      context: .
      dockerfile: agents/ingest/Dockerfile
    container_name: ingest-agent
    ports:
      - "8002:8002"
    environment:
      - PUBSUB_URL=http://pubsub:8001
    env_file:
      - .env
    depends_on:
      pubsub:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  chat-agent:
    build:
      context: .
      dockerfile: agents/chat/Dockerfile
    container_name: chat-agent
    ports:
      - "8003:8003"
    environment:
      - PUBSUB_URL=http://pubsub:8001
    env_file:
      - .env
    depends_on:
      pubsub:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  analytics-agent:
    build:
      context: .
      dockerfile: agents/analytics/Dockerfile
    container_name: analytics-agent
    ports:
      - "8004:8004"
    env_file:
      - .env
    depends_on:
      pubsub:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped


networks:
  agent-network:
    driver: bridge
