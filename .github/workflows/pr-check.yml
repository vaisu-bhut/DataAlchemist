name: PR Check

on:
  pull_request:
    branches: [main, staging]

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    name: Terraform Validation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform Init
        run: |
          cd terraform
          terraform init
        
      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

  docker-test:
    runs-on: ubuntu-latest
    name: Docker Compose Test (All 5 Services)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test .env file
        run: |
          cd services
          cat > .env << EOF
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=test_password
          GEMINI_API_KEY=test_key
          GEMINI_MODEL_NAME=gemini-2.0-flash-exp
          GEMINI_EMBEDDING_MODEL=models/text-embedding-004
          SECRET_KEY=test_secret_key
          CHUNK_SIZE=2000
          SIMILARITY_THRESHOLD=0.85
          CONFIDENCE_THRESHOLD=0.7
          MAX_RETRIEVAL_RESULTS=10
          EOF

      - name: Start services with Docker Compose
        run: |
          cd services
          docker compose up -d
          echo "⏳ Waiting for services to start..."
          sleep 45

      - name: Check running containers
        run: |
          cd services
          echo "📦 Running containers:"
          docker compose ps

      - name: Check service health
        run: |
          cd services
          
          echo "🔍 Checking Pub/Sub (port 8001)..."
          curl -f http://localhost:8001/health || (echo "❌ Pub/Sub health check failed" && exit 1)
          
          echo "🔍 Checking Master Agent (port 8000)..."
          curl -f http://localhost:8000/health || (echo "❌ Master Agent health check failed" && exit 1)
          
          echo "🔍 Checking Ingest Agent (port 8002)..."
          curl -f http://localhost:8002/health || (echo "❌ Ingest Agent health check failed" && exit 1)
          
          echo "🔍 Checking Chat Agent (port 8003)..."
          curl -f http://localhost:8003/health || (echo "❌ Chat Agent health check failed" && exit 1)
          
          echo "🔍 Checking Analytics Agent (port 8004)..."
          curl -f http://localhost:8004/health || (echo "❌ Analytics Agent health check failed" && exit 1)
          
          echo "✅ All 5 services are healthy!"

      - name: Show service logs on failure
        if: failure()
        run: |
          cd services
          echo "📋 Pub/Sub logs:"
          docker compose logs pubsub --tail=50
          echo "📋 Master Agent logs:"
          docker compose logs master-agent --tail=50
          echo "📋 Ingest Agent logs:"
          docker compose logs ingest-agent --tail=50
          echo "📋 Chat Agent logs:"
          docker compose logs chat-agent --tail=50
          echo "📋 Analytics Agent logs:"
          docker compose logs analytics-agent --tail=50

      - name: Cleanup
        if: always()
        run: |
          cd services
          docker compose down -v
