name: PR Check

on:
  pull_request:
    branches: [main, staging]

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    name: Terraform Validation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform Init
        run: |
          cd terraform
          terraform init
        
      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

  docker-test:
    runs-on: ubuntu-latest
    name: Docker Compose Test (All 5 Services)
    
    services:
      neo4j:
        image: neo4j:5.13.0
        env:
          NEO4J_AUTH: neo4j/test_password
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test .env file
        run: |
          cd services
          cat > .env << EOF
          NEO4J_URI=bolt://172.17.0.1:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=test_password
          GEMINI_API_KEY=test_key
          GEMINI_MODEL_NAME=gemini-2.0-flash-exp
          GEMINI_EMBEDDING_MODEL=models/text-embedding-004
          SECRET_KEY=test_secret_key
          CHUNK_SIZE=2000
          SIMILARITY_THRESHOLD=0.85
          CONFIDENCE_THRESHOLD=0.7
          MAX_RETRIEVAL_RESULTS=10
          EOF
      
      - name: Wait for Neo4j to be ready
        run: |
          echo "⏳ Waiting for Neo4j to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:7474 > /dev/null 2>&1; do sleep 2; done'
          echo "✅ Neo4j is ready!"
      
      - name: Configure Docker Compose for CI
        run: |
          cd services
          # Use host network mode so containers can access Neo4j on localhost
          export DOCKER_BUILDKIT=1
          echo "Using host Neo4j at localhost:7687"

      - name: Start services with Docker Compose
        run: |
          cd services
          docker compose up -d
          echo "⏳ Waiting for services to start..."
          sleep 45

      - name: Check running containers
        run: |
          cd services
          echo "📦 Running containers:"
          docker compose ps

      - name: Check service health
        run: |
          cd services
          
          echo "🔍 Checking Pub/Sub (port 8001)..."
          curl -f http://localhost:8001/health || (echo "❌ Pub/Sub health check failed" && exit 1)
          
          echo "🔍 Checking Master Agent (port 8000)..."
          curl -f http://localhost:8000/health || (echo "❌ Master Agent health check failed" && exit 1)
          
          echo "🔍 Checking Ingest Agent (port 8002)..."
          curl -f http://localhost:8002/health || (echo "❌ Ingest Agent health check failed" && exit 1)
          
          echo "🔍 Checking Chat Agent (port 8003)..."
          curl -f http://localhost:8003/health || (echo "❌ Chat Agent health check failed" && exit 1)
          
          echo "🔍 Checking Analytics Agent (port 8004)..."
          curl -f http://localhost:8004/health || (echo "❌ Analytics Agent health check failed" && exit 1)
          
          echo "✅ All 5 services are healthy!"

      - name: Show service logs on failure
        if: failure()
        run: |
          cd services
          echo "📋 Pub/Sub logs:"
          docker compose logs pubsub --tail=50
          echo "📋 Master Agent logs:"
          docker compose logs master-agent --tail=50
          echo "📋 Ingest Agent logs:"
          docker compose logs ingest-agent --tail=50
          echo "📋 Chat Agent logs:"
          docker compose logs chat-agent --tail=50
          echo "📋 Analytics Agent logs:"
          docker compose logs analytics-agent --tail=50

      - name: Cleanup
        if: always()
        run: |
          cd services
          docker compose down -v
