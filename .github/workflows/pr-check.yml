name: PR Check

on:
  pull_request:
    branches: [main, staging]

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    name: Terraform Validation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 6.5.0

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform Init
        run: |
          cd terraform
          terraform init
        
      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

  docker-test:
    runs-on: ubuntu-latest
    name: Docker Compose Test (All 4 Services)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test .env file
        run: |
          cd services
          cat > .env << EOF
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=test_password
          GEMINI_API_KEY=test_key
          GEMINI_MODEL_NAME=gemini-2.0-flash-exp
          GEMINI_EMBEDDING_MODEL=models/text-embedding-004
          SECRET_KEY=test_secret_key
          CHUNK_SIZE=2000
          SIMILARITY_THRESHOLD=0.85
          CONFIDENCE_THRESHOLD=0.7
          MAX_RETRIEVAL_RESULTS=10
          EOF

      - name: Build all Docker images
        run: |
          cd services
          echo "🔨 Building Pub/Sub..."
          docker build -t pubsub:test -f pubsub/Dockerfile .
          
          echo "🔨 Building Master Agent..."
          docker build -t master-agent:test -f agents/master/Dockerfile .
          
          echo "🔨 Building Ingest Agent..."
          docker build -t ingest-agent:test -f agents/ingest/Dockerfile .
          
          echo "🔨 Building Chat Agent..."
          docker build -t chat-agent:test -f agents/chat/Dockerfile .
          
          echo "✅ All images built successfully"

      - name: Start services with Docker Compose
        run: |
          cd services
          docker-compose up -d
          echo "⏳ Waiting for services to start..."
          sleep 30

      - name: Check service health
        run: |
          cd services
          
          echo "🔍 Checking Pub/Sub (port 8001)..."
          curl -f http://localhost:8001/health || (echo "❌ Pub/Sub health check failed" && exit 1)
          
          echo "🔍 Checking Master Agent (port 8000)..."
          curl -f http://localhost:8000/health || (echo "❌ Master Agent health check failed" && exit 1)
          
          echo "🔍 Checking Ingest Agent (port 8002)..."
          curl -f http://localhost:8002/health || (echo "❌ Ingest Agent health check failed" && exit 1)
          
          echo "🔍 Checking Chat Agent (port 8003)..."
          curl -f http://localhost:8003/health || (echo "❌ Chat Agent health check failed" && exit 1)
          
          echo "✅ All services are healthy!"

      - name: Show service logs on failure
        if: failure()
        run: |
          cd services
          echo "📋 Pub/Sub logs:"
          docker-compose logs pubsub
          echo "📋 Master Agent logs:"
          docker-compose logs master-agent
          echo "📋 Ingest Agent logs:"
          docker-compose logs ingest-agent
          echo "📋 Chat Agent logs:"
          docker-compose logs chat-agent

      - name: Cleanup
        if: always()
        run: |
          cd services
          docker-compose down -v
