name: Deploy Agentic Workflow to Cloud Run

on:
  push:
    branches: [main, staging]
    paths:
      - 'services/**'
      - 'terraform/**'
      - '.github/workflows/deploy-agents.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPO_NAME: agentic-system

jobs:
  build-and-push:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev
      
      - name: Create Artifact Registry repository
        run: |
          gcloud artifacts repositories describe ${{ env.REPO_NAME }} \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} 2>/dev/null || \
          gcloud artifacts repositories create ${{ env.REPO_NAME }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="Agentic workflow system containers" \
            --project=${{ env.PROJECT_ID }}
      
      - name: Build and Push Pub/Sub Service
        working-directory: ./services
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/pubsub:latest
          docker build -t $IMAGE -f pubsub/Dockerfile .
          docker push $IMAGE
      
      - name: Build and Push Master Agent
        working-directory: ./services
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/master-agent:latest
          docker build -t $IMAGE -f agents/master/Dockerfile .
          docker push $IMAGE
      
      - name: Build and Push Ingest Agent
        working-directory: ./services
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/ingest-agent:latest
          docker build -t $IMAGE -f agents/ingest/Dockerfile .
          docker push $IMAGE
      
      - name: Build and Push Chat Agent
        working-directory: ./services
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/chat-agent:latest
          docker build -t $IMAGE -f agents/chat/Dockerfile .
          docker push $IMAGE
