name: Deploy Agentic Workflow to Cloud Run

on:
  push:
    branches: [main, staging]
    paths:
      - 'services/**'
      - 'terraform/**'
      - '.github/workflows/deploy-agents.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east1
  REPO_NAME: agentic-system

jobs:
  build-and-push:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Generate Image Tag
        id: image_tag
        run: |
          # Use commit SHA for versioning
          TAG="${GITHUB_SHA:0:7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📦 Image tag: $TAG"
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev
      
      - name: Verify Artifact Registry repository
        run: |
          if gcloud artifacts repositories describe ${{ env.REPO_NAME }} \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} 2>/dev/null; then
            echo "✅ Artifact Registry repository exists"
          else
            echo "Creating repository..."
            gcloud artifacts repositories create ${{ env.REPO_NAME }} \
              --repository-format=docker \
              --location=${{ env.REGION }} \
              --description="Agentic workflow system containers" \
              --project=${{ env.PROJECT_ID }} || true
          fi
      
      - name: Build and Push Pub/Sub Service
        working-directory: ./services
        run: |
          TAG=${{ steps.image_tag.outputs.tag }}
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/pubsub
          docker build -t $IMAGE:$TAG -t $IMAGE:latest -f pubsub/Dockerfile .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
      
      - name: Build and Push Master Agent
        working-directory: ./services
        run: |
          TAG=${{ steps.image_tag.outputs.tag }}
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/master-agent
          docker build -t $IMAGE:$TAG -t $IMAGE:latest -f agents/master/Dockerfile .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
      
      - name: Build and Push Ingest Agent
        working-directory: ./services
        run: |
          TAG=${{ steps.image_tag.outputs.tag }}
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/ingest-agent
          docker build -t $IMAGE:$TAG -t $IMAGE:latest -f agents/ingest/Dockerfile .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
      
      - name: Build and Push Chat Agent
        working-directory: ./services
        run: |
          TAG=${{ steps.image_tag.outputs.tag }}
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/chat-agent
          docker build -t $IMAGE:$TAG -t $IMAGE:latest -f agents/chat/Dockerfile .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
  
  deploy:
    name: Deploy to Cloud Run (Zero Downtime)
    runs-on: ubuntu-latest
    needs: build-and-push
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Deploy Pub/Sub Service
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/pubsub:$TAG
          
          echo "🚀 Deploying Pub/Sub Service with image: $IMAGE"
          
          gcloud run deploy pubsub \
            --image=$IMAGE \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=cloud-run-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --min-instances=1 \
            --max-instances=3 \
            --memory=256Mi \
            --cpu=1 \
            --port=8001 \
            --no-traffic \
            --tag=candidate
          
          # Gradually shift traffic (zero downtime)
          gcloud run services update-traffic pubsub \
            --to-latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
          
          echo "✅ Pub/Sub deployed"
      
      - name: Deploy Master Agent
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/master-agent:$TAG
          PUBSUB_URL=$(gcloud run services describe pubsub --region=${{ env.REGION }} --format='value(status.url)')
          
          echo "🚀 Deploying Master Agent with image: $IMAGE"
          
          gcloud run deploy master-agent \
            --image=$IMAGE \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=cloud-run-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --min-instances=1 \
            --max-instances=5 \
            --memory=512Mi \
            --cpu=1 \
            --port=8000 \
            --set-env-vars="PUBSUB_URL=$PUBSUB_URL" \
            --no-traffic \
            --tag=candidate
          
          # Gradually shift traffic
          gcloud run services update-traffic master-agent \
            --to-latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
          
          echo "✅ Master Agent deployed"
      
      - name: Deploy Ingest Agent
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/ingest-agent:$TAG
          PUBSUB_URL=$(gcloud run services describe pubsub --region=${{ env.REGION }} --format='value(status.url)')
          
          echo "🚀 Deploying Ingest Agent with image: $IMAGE"
          
          gcloud run deploy ingest-agent \
            --image=$IMAGE \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=cloud-run-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --min-instances=0 \
            --max-instances=10 \
            --memory=2Gi \
            --cpu=2 \
            --port=8002 \
            --timeout=300 \
            --set-env-vars="PUBSUB_URL=$PUBSUB_URL" \
            --set-secrets="DATABASE_CREDENTIALS=database-credentials:latest,API_KEYS=api-keys:latest" \
            --no-traffic \
            --tag=candidate
          
          # Gradually shift traffic
          gcloud run services update-traffic ingest-agent \
            --to-latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
          
          echo "✅ Ingest Agent deployed"
      
      - name: Deploy Chat Agent
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/chat-agent:$TAG
          PUBSUB_URL=$(gcloud run services describe pubsub --region=${{ env.REGION }} --format='value(status.url)')
          
          echo "🚀 Deploying Chat Agent with image: $IMAGE"
          
          gcloud run deploy chat-agent \
            --image=$IMAGE \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=cloud-run-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --min-instances=1 \
            --max-instances=20 \
            --memory=1Gi \
            --cpu=1 \
            --port=8003 \
            --timeout=60 \
            --set-env-vars="PUBSUB_URL=$PUBSUB_URL" \
            --set-secrets="DATABASE_CREDENTIALS=database-credentials:latest,API_KEYS=api-keys:latest" \
            --no-traffic \
            --tag=candidate
          
          # Gradually shift traffic
          gcloud run services update-traffic chat-agent \
            --to-latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
          
          echo "✅ Chat Agent deployed"
      
      - name: Get Service URLs
        id: urls
        run: |
          MASTER_URL=$(gcloud run services describe master-agent --region=${{ env.REGION }} --format='value(status.url)')
          echo "master_url=$MASTER_URL" >> $GITHUB_OUTPUT
          echo "🔗 Master Agent URL: $MASTER_URL"
      
      - name: Test Deployment
        run: |
          MASTER_URL=${{ steps.urls.outputs.master_url }}
          echo "🧪 Testing deployment..."
          
          # Wait for service to be ready
          sleep 10
          
          # Test health endpoint
          if curl -f -s "$MASTER_URL/health" > /dev/null; then
            echo "✅ Health check passed"
          else
            echo "⚠️  Health check failed (service may still be starting)"
          fi
      
      - name: Deployment Summary
        run: |
          echo "🎉 Deployment Complete!"
          echo ""
          echo "📦 Image Tag: ${{ needs.build-and-push.outputs.image_tag }}"
          echo "🔗 Master Agent: ${{ steps.urls.outputs.master_url }}"
          echo ""
          echo "✅ Zero-downtime deployment successful"
          echo "   - New revision deployed with --no-traffic"
          echo "   - Traffic gradually shifted to new revision"
          echo "   - Old revision kept running during transition"
